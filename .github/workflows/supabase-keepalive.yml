# Weekly Supabase keep-alive to prevent free-tier project from pausing.
# See scripts/supabase_keepalive.py for details.
#
# Required GitHub repo secrets:
#   SUPABASE_URL (or VITE_SUPABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY
#
# Add at: Repo → Settings → Secrets and variables → Actions

name: Supabase Keep-Alive

on:
  schedule:
    # Run every Sunday at 9:00 AM UTC
    - cron: '0 9 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run keep-alive script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/supabase_keepalive.py
